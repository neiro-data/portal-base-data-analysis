services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: ${PG_MAJOR:-17}
        PG_PARQUET_VERSION: ${PG_PARQUET_VERSION:-0.5.1}
        PGRX_VERSION: ${PGRX_VERSION:-0.16.0}
    image: portal-base/postgres-pg-parquet:17-0.5.1
    container_name: pbd-postgres
    # Docker's 64MB default /dev/shm overflows on parallel queries over 10y of data
    shm_size: 1gb
    command: postgres -c shared_preload_libraries=pg_parquet -c max_wal_size=2GB -c shared_buffers=512MB -c effective_cache_size=1536MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-base_gov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base_gov}
      POSTGRES_DB: ${POSTGRES_DB:-base_gov}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOTE: the whole ./sql tree is mounted here, but only sql/00*.sql runs
      # on init — the postgres entrypoint globs this dir non-recursively, so
      # sql/ingest/ (a subdirectory) is skipped. Keep ingest scripts nested
      # under sql/ingest/, never as sql/NN_*.sql, or they'll auto-run on
      # every fresh volume init. See tests/test_sql_migrations.py.
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./data:/parquet:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base_gov} -d ${POSTGRES_DB:-base_gov}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: pbd-grafana
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base_gov}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-changeme_grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Remote image renderer, used by `base-gov report` (PNG panels -> PDF).
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:-changeme_renderer}
      # GF_LOG_FILTERS: rendering:debug
    ports:
      # Loopback-only: anonymous Editor access above has no auth, so this
      # must not be reachable beyond the local machine.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["dashboard"]

  renderer:
    image: grafana/grafana-image-renderer:v5.12.5
    container_name: pbd-renderer
    # No published port: only reachable from grafana on the compose network.
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:-changeme_renderer}
    profiles: ["dashboard"]

volumes:
  pgdata:
  grafana-data:
