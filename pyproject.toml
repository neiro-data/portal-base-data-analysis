[project]
name = "base-gov"
version = "0.1.0"
description = "Load Portugal's public procurement bulk export (base.gov.pt) as parquet and query it"
readme = "README.md"
authors = [
    { name = "neiro", email = "nelsonaeiro+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.21.0",
    "polars>=1.44.1",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
base-gov = "base_gov.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
