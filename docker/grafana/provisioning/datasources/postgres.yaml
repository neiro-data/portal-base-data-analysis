# Provisioned Postgres datasource. Grafana expands $VAR / ${VAR} in provisioning
# files against its own process environment (native since Grafana 8), so
# POSTGRES_DB and GRAFANA_DB_PASSWORD below come straight from the grafana
# service's env in docker-compose.yml.
apiVersion: 1

datasources:
  - name: procurement-analytics
    uid: procurement-analytics-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      # Grafana 12 reads the database from jsonData only (top-level `database` was dropped).
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
